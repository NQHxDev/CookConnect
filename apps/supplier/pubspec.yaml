name: cook_connect_seller
description: "CookConnect Seller mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  flutter_remix: ^0.0.3
  http: ^1.2.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.2.3
  shared_widgets:
    path: ../../packages/shared_widgets
  camera: ^0.12.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: TikTokSans
      fonts:
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-Light.ttf
          weight: 300
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/TikTok_Sans/static/TikTokSans-Black.ttf
          weight: 900
